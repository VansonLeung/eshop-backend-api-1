openapi: 3.0.3
info:
  title: Eshop CMS API
  description: RESTful API for comprehensive eshop content management system with 23 entities
  version: 1.0.0
  contact:
    name: Eshop CMS Development Team

servers:
  - url: https://api.eshop-cms.com/v1
    description: Production server
  - url: http://localhost:3000/api
    description: Development server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
