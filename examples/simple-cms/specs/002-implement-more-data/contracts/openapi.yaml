        - orderId
        - method
        - amount

    OrderPaymentUpdate:
      type: object
      properties:
        method:
          type: string
          enum: [credit_card, paypal, bank_transfer, cash]
        status:
          type: string
          enum: [pending, processing, completed, failed, refunded]
        amount:
          type: number
          format: float
          minimum: 0
        currency:
          type: string
        transactionId:
          type: string

    # Content Management Schemas
    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
          description: HTML content (sanitized)
        authorId:
          type: integer
        typeId:
          type: integer
        langId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - authorId

    PostCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          description: HTML content to be sanitized
        authorId:
          type: integer
        typeId:
          type: integer
        langId:
          type: integer
      required:
        - title
        - content
        - authorId

    PostUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          description: HTML content to be sanitized
        authorId:
          type: integer
        typeId:
          type: integer
        langId:
          type: integer

    PostType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name

    PostTypeCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
      required:
        - name

    PostTypeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    Lang:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          description: ISO language code (e.g., 'en', 'es', 'fr')
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name

    LangCreate:
      type: object
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 10
          pattern: '^[a-zA-Z]{2,3}(-[a-zA-Z]{2})?$'
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - code
        - name

    LangUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 10
          pattern: '^[a-zA-Z]{2,3}(-[a-zA-Z]{2})?$'
        name:
          type: string
          minLength: 1
          maxLength: 100

